# Fly.io — one always-on machine with a persistent volume.
#
# `auto_stop_machines` is deliberately off. A machine that suspends between
# requests would discard the in-process event bus mid-match, which is exactly
# the failure mode this deployment target exists to avoid.

app = "ai-agent-arena"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  ARENA_DATA_DIR = "/data"
  PORT = "3000"

[[mounts]]
  source = "arena_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      path = "/api/health"
      interval = "30s"
      timeout = "5s"
      grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
