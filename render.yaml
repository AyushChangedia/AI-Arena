# Render Blueprint — a web service and the Postgres it stores everything in.
#
# Provisioned together so a one-click deploy lands on the full product rather
# than a demo that forgets itself: DATABASE_URL is wired from the database
# below, so matches, agents, Elo ratings and votes are shared across instances
# and survive every restart and redeploy with nothing to configure.
#
# The disk is still mounted. It is the fallback the app uses if the database is
# ever unreachable, and it costs nothing to keep.
databases:
  - name: arena-db
    databaseName: arena
    user: arena
    plan: basic-256mb

services:
  - type: web
    name: ai-agent-arena
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: arena-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ARENA_DATA_DIR
        value: /data
      # Shared, durable storage. Everything else follows from this one variable.
      - key: DATABASE_URL
        fromDatabase:
          name: arena-db
          property: connectionString
      # The public origin, so canonical tags and Open Graph point at the real
      # host rather than the platform's internal one.
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: ai-agent-arena
          type: web
          property: host
      # Set these in the dashboard to promote DEMO matches to LIVE.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
